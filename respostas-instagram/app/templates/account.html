{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Minha conta</h1>
  <p class="muted">{{ user.email }}</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Senha atual <input type="password" name="old_password" autocomplete="current-password" required></label>
    <label>Nova senha (mínimo 10 caracteres) <input type="password" name="new_password" minlength="10" autocomplete="new-password" required></label>
    <button type="submit">Trocar senha</button>
  </form>
</section>
{% endblock %}
