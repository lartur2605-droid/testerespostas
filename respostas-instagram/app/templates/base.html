<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Respostas Instagram{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('panel.index') }}">Respostas Instagram</a>
    {% if user %}
    <nav class="usernav">
      {% if user.role == 'admin' %}<a href="{{ url_for('panel.users') }}">Usuários</a>{% endif %}
      <a href="{{ url_for('panel.account') }}">Minha conta</a>
      <form method="post" action="{{ url_for('panel.logout') }}" class="inline">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="link" type="submit">Sair</button>
      </form>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
